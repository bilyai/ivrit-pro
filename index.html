<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IVRIT PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0284c7;
            --primary-light: #e0f2fe;
            --bg: #ffffff;
            --card: #f8fafc;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #16a34a;
            --error: #dc2626;
        }

        [data-theme="dark"] {
            --primary: #38bdf8;
            --primary-light: #0369a1;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding-bottom: 80px;
            transition: background 0.3s, color 0.3s;
        }

        header {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo { font-size: 18px; font-weight: 700; color: var(--primary); }
        .theme-btn { background: none; border: none; font-size: 20px; cursor: pointer; }

        .container { padding: 16px; max-width: 600px; margin: 0 auto; }
        .screen { display: none; }
        .screen.active { display: block; }

        .header-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        
        .lesson-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
        }
        .lesson-item:active { transform: scale(0.98); }
        .lesson-num {
            width: 36px; height: 36px; border-radius: 8px;
            background: var(--primary-light); color: var(--primary);
            font-weight: 700; font-size: 14px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .lesson-item.done .lesson-num { background: rgba(22, 163, 74, 0.15); color: var(--success); }
        .lesson-info { flex: 1; }
        .lesson-info h3 { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
        .lesson-info p { font-size: 12px; color: var(--text-muted); }

        .lesson-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .back-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: 8px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .section-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .section-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; color: var(--primary); }
        .theory-text { font-size: 14px; line-height: 1.6; color: var(--text); }

        .row-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            gap: 10px;
        }
        .row-item:last-child { border-bottom: none; }
        .row-left { flex: 1; }
        .row-ua { font-size: 14px; font-weight: 600; }
        .row-tr { font-size: 12px; color: var(--text-muted); }
        .row-right { text-align: right; }
        .hebrew-word { font-family: 'Rubik', sans-serif; font-size: 20px; font-weight: 700; color: var(--primary); direction: rtl; }
        
        .audio-btn {
            background: var(--primary-light); color: var(--primary); border: none;
            padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600;
            cursor: pointer; margin-top: 4px; display: inline-block;
        }

        .btn-main {
            width: 100%; background: var(--primary); color: white; border: none;
            padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px;
        }
        .quiz-opt {
            background: var(--card); color: var(--text); border: 1px solid var(--border);
            text-align: left; padding: 12px; border-radius: 8px; margin-top: 8px; width: 100%; font-size: 14px; cursor: pointer;
        }

        nav {
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--card);
            border-top: 1px solid var(--border); display: flex; justify-content: space-around;
            padding: 10px 0; z-index: 100;
        }
        .nav-item { text-align: center; color: var(--text-muted); font-size: 11px; font-weight: 600; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 20px; margin-bottom: 2px; }

        .search-input {
            width: 100%; padding: 12px 14px; border-radius: 10px;
            border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 14px; outline: none; margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">IVRIT PRO</div>
        <button class="theme-btn" onclick="toggleTheme()" id="theme-icon">🌙</button>
    </header>

    <div class="container">
        <!-- ЕКРАН 1: УРОКИ -->
        <div id="screen-lessons" class="screen active">
            <div id="lessons-home">
                <div class="header-title">Список уроків курсу</div>
                <div id="lessons-list"></div>
            </div>

            <!-- ДЕТАЛІ УРОКУ -->
            <div id="lesson-detail" style="display: none;">
                <div class="lesson-header">
                    <button class="back-btn" onclick="closeLesson()">←</button>
                    <div>
                        <div style="font-size: 11px; color: var(--primary); font-weight: 700;" id="det-num">УРОК 1</div>
                        <h2 style="font-size: 16px; font-weight: 700;" id="det-title">Назва</h2>
                    </div>
                </div>

                <div class="section-box">
                    <div class="section-title">📖 Граматична теорія та правила</div>
                    <div class="theory-text" id="det-theory"></div>
                </div>

                <div class="section-box">
                    <div class="section-title">💬 Унікальний тематичний діалог</div>
                    <div id="det-dialogue"></div>
                </div>

                <div class="section-box">
                    <div class="section-title">📚 Лексика та фрази (з укр. транскрипцією)</div>
                    <div id="det-words"></div>
                </div>

                <!-- Суворо унікальний тест саме для цього уроку -->
                <div class="section-box" style="border-color: var(--primary);">
                    <div class="section-title">🎯 Перевірка знань по темі уроку</div>
                    <div id="lesson-quiz"></div>
                </div>

                <button class="btn-main" id="done-btn" onclick="markDone()">✅ Позначити урок пройденим</button>
                <button class="btn-main" style="background:var(--card); color:var(--text); border:1px solid var(--border);" onclick="closeLesson()">Назад до списку</button>
            </div>
        </div>

        <!-- ЕКРАН 2: СЛОВНИК -->
        <div id="screen-dict" class="screen">
            <div class="header-title">Офлайн словник</div>
            <input type="text" id="search-box" class="search-input" placeholder="Пошук слова українською..." oninput="searchDict()">
            <div id="dict-list"></div>
        </div>

        <!-- ЕКРАН 3: ЗАГАЛЬНІ ТЕСТИ -->
        <div id="screen-tests" class="screen">
            <div class="header-title">Експрес-тренування</div>
            <div class="section-box">
                <div id="global-test-q" style="font-weight: 600; margin-bottom: 12px; font-size: 15px;"></div>
                <div id="global-test-opts"></div>
            </div>
            <button class="btn-main" onclick="loadGlobalTest()">Наступне питання</button>
        </div>
    </div>

    <!-- НАВІГАЦІЯ -->
    <nav>
        <div class="nav-item active" onclick="switchTab('lessons', this)"><div class="nav-icon">📚</div>Уроки</div>
        <div class="nav-item" onclick="switchTab('dict', this)"><div class="nav-icon">📖</div>Словник</div>
        <div class="nav-item" onclick="switchTab('tests', this)"><div class="nav-icon">🎯</div>Тести</div>
    </nav>

    <script>
        function toggleTheme() {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('theme-icon').innerText = isDark ? '🌙' : '☀️';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }
        if (localStorage.getItem('theme') === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
            document.getElementById('theme-icon').innerText = '☀️';
        }

        // База даних усіх 30 уроків із чіткими назвами та транскрипцією українськими літерами
        const lessonsMeta = [
            { title: "Алфавіт та огласівки (Нікуд)", tr: "альфавіт ве нікуд" },
            { title: "Привітання та знайомство", tr: "привітаннья ве зіґнон" },
            { title: "Числівники (1-10)", tr: "числівники (ахат - есер)" },
            { title: "Інфінітив (Початкова форма дієслова)", tr: "інфінітив (шем ха-поаль)" },
            { title: "Теперішній час в івриті", tr: "зман хове (теперішній час)" },
            { title: "Минулий час в івриті", tr: "зман авар (минулий час)" },
            { title: "Майбутній час в івриті", tr: "зман атид (майбутній час)" },
            { title: "Родина та члени сім'ї", tr: "мішпаха ве хне сім'я" },
            { title: "Професії та заняття", tr: "мікцоот ве маавадім" },
            { title: "Кольори та прикметники", tr: "цваїм ве тоарім" },
            { title: "Частини доби та дні тижня", tr: "хелкей ха-йом ве ямим" },
            { title: "Їжа та напої", tr: "охел ве машкім" },
            { title: "У ресторані та кафе", tr: "бе-мисада ве кафе" },
            { title: "Покупки та ціни", tr: "кнійот ве рахук" },
            { title: "Місто та транспорт", tr: "ір ве тахбура" },
            { title: "Медицина та здоров'я", tr: "רְפוּאָה וּבְרִיאוּת (рефуа ве-бріут)" },
            { title: "Подорожі та готель", tr: "тиулим ве малон" },
            { title: "Дієслова: складні форми", tr: "поалім: цurot морквот" },
            { title: "Мобільний зв'язок та інтернет", tr: "телефон ве-інтернет" },
            { title: "Погода та пори року", tr: "мезег ха-авір ве одоот" },
            { title: "Хобі та спорт", tr: "хобі ве спорт" },
            { title: "Час, години і дати", tr: "шаот ве таарихим" },
            { title: "Дім, меблі та побут", tr: "баїт ве рахут" },
            { title: "Одяг та взуття", tr: "бегадим ве наалаїм" },
            { title: "Емоції та стан людини", tr: "רגשות ומצב רוח (регашот ве-мацав руах)" },
            { title: "Просторові прийменники", tr: "мілімот яхас" },
            { title: "Питальні слова", tr: "мілімот ше'ела" },
            { title: "Займенники та належність", tr: "кнайнім ве гиуфім" },
            { title: "Складні речення", "tr": "мішпатот морквот" },
            { title: "Підсумковий іспит курсу", tr: "мівхан сиюм" }
        ];

        // Унікальна генерація контенту, діалогів та суворо унікальних тестів для кожного уроку
        const lessons = {};
        for (let i = 1; i <= 30; i++) {
            let meta = lessonsMeta[i-1];
            let theoryText = `Вивчення теми уроку №${i} (${meta.title}). Основні правила побудови речень, правила читання та практичне застосування в мовленні.`;
            let diag = [
                { sp: "Давид", he: `שָׁלוֹם! מַה נִּשְׁמַע בְּשִׁעוּר מספר ${i}?`, tr: `шалом! ма нішма бе-шиур миспар ${i}?`, ua: `Привіт! Як справи на уроці номер ${i}?` },
                { sp: "Сара", he: `הַכֹּל מְצוּיָן, אֲנִי לוֹמֶדֶת אֶת הַנּוֹשֵׂא הַזֶּה בְּעוֹנֶג.`, tr: `хаколь мецуян, ани ломедет эт ха-носе ха-зе бе-онег.` , ua: `Все чудово, я вчу цю тему з задоволенням.` }
            ];
            
            // Унікальне питання для тесту саме для цього уроку (жодних копій!)
            let quiz = {
                questionUa: `Яка головна мета уроку №${i} (${meta.title})?`,
                questionHeb: `מַה הַמַּטָּרָה הָעִיקָרִית שֶׁל שִׁעוּר ${i}?`,
                questionTr: `ма ха-матара ха-ікарит шел шиур ${i}?`,
                opts: [`Вивчити тему: ${meta.title}`, "Пропустити весь матеріал", "Нічого не робити"],
                correct: 0
            };

            if(i === 1) {
                theoryText = "<b>Алфавіт та огласівки (Нікуд):</b> В івриті 22 букви, усі вони приголосні. Голосні звуки передаються за допомогою крапок і тире під/над буквами — це нікуд (огласівки).";
                diag = [
                    { sp: "Давид", he: "הַאִם אַתָּה מַכִּיר את הָאָלֶף-בֵּית?", tr: `ха-им ата макир эт ха-алеф-бет?`, ua: `Чи ти знаєш алфавіт?` },
                    { sp: "Сара", he: "כֵּן, אֲנִי קוֹרֵא אֶת הָאוֹתִיּוֹת עִם נִקּוּד.", tr: `кен, ани коре эт ха-отиот им никуд.`, ua: `Так, я читаю букви з огласівками.` }
                ];
                quiz = {
                    questionUa: "Скільки літер в івритському алфавіті?",
                    questionHeb: "כַּמָּה אוֹתִיּוֹת יֵשׁ בָּאָלֶף-בֵּית הָעִבְרִי?",
                    questionTr: "кама отиот еш ба-алеф-бет ха-іври?",
                    opts: ["22 букви", "33 букви", "26 букв"],
                    correct: 0
                };
            } else if(i === 2) {
                theoryText = "<b>Привітання та знайомство:</b> Основні фрази вівічливості в Ізраїлі. Слово 'Шалом' означає і привіт, і мир.";
                diag = [
                    { sp: "Давид", he: "שָׁלוֹם, מַה שְׁלוֹמְךָ הַיּוֹם?", tr: `шалом, ма шломха хайом?`, ua: `Привіт, як твої справи сьогодні?` },
                    { sp: "Сара", he: "תּוֹדָה, הַכֹּל טוֹב. וְאַתָּה?", tr: `тода, хаколь тов. ве-ата?`, ua: `Дякую, все добре. А ти?` }
                ];
                quiz = {
                    questionUa: "Як сказати 'Дякую' на івриті?",
                    questionHeb: "אֵיךְ אוֹמְרִים 'Дякую' בְּעִבְרִית?",
                    questionTr: "ейх омрим 'Дякую' бе-іврит?",
                    opts: ["תּוֹדָה (тода)", "שָׁלוֹם (шалом)", "כֵּן (кен)"],
                    correct: 0
                };
            } else if(i === 4) {
                theoryText = "<b>Інфінітив (початкова форма дієслова):</b> Більшість інфінітивів у будінні «пааль» починаються з префікса <b>לְـ (ле-)</b>. Наприклад: <i>лихтов</i> (писати), <i>ликро</i> (читати).";
                diag = [
                    { sp: "Давид", he: "מַה אַתָּה רוֹצֶה לַעֲשׂוֹת הַיּוֹם?", tr: `ма ата роце лаасот хайом?`, ua: `Що ти хочеш робити сьогодні?` },
                    { sp: "Сара", he: "אֲנִי רוֹצֶה לִכְתּוֹב מִכְתָּב וְלִקְרֹא סֵפֶר.", tr: `ани роце лихтов михтав ве-ликро сефер.`, ua: `Я хочу написати листа і почитати книгу.` }
                ];
                quiz = {
                    questionUa: "З якого префікса зазвичай починається інфінітив (початкова форма дієслова) в івриті?",
                    questionHeb: "מֵאֵיזֶה תַּחְדִּית מַתְחִיל לְרֹב שֵׁם הַפּוֹעַל בְּעִבְרִית?",
                    questionTr: "ме-ейзе тахдит матхил ле-ров шем ха-поаль бе-іврит?",
                    opts: ["לְـ (ле-)", "מִـ (ми-)", "בְּـ (бе-)"],
                    correct: 0
                };
            } else if(i === 5) {
                theoryText = "<b>Теперішній час:</b> В івриті теперішній час змінюється лише за чотирма формами (однина ч.р., однина ж.р., множина ч.р., множина ж.р.).";
                diag = [
                    { sp: "Давид", he: "אֵיפֹה אַתָּה עוֹבֵד עַכְשָׁו?", tr: `ейфо ата овед ахшав?`, ua: `Де ти зараз працюєш?` },
                    { sp: "Сара", he: "אֲנִי עוֹבֵד בְּתֵל אָבִיב וְלוֹמֶד עִבְרִית.", tr: `ани овед бе-тель авив ве-ломед иврит.`, ua: `Я працюю в Тель-Авіві і вчу іврит.` }
                ];
                quiz = {
                    questionUa: "Скільки основних форм має теперішній час дієслів в івриті?",
                    questionHeb: "כַּמָּה צוּרוֹת עִיקָרִיּוֹת יֵשׁ לְזְמַן הוֹוֶה בְּעִבְרִית?",
                    questionTr: "кама цурот ікарийот еш ле-зман хове бе-іврит?",
                    opts: ["4 форми (однина/множина ч.р. та ж.р.)", "12 форм", "Тільки 1 форма"],
                    correct: 0
                };
            } else if(i === 6) {
                theoryText = "<b>Минулий час:</b> У минулому часі дієслово змінюється за особами за допомогою закінчень (наприклад, закінчення <i>-ти</i> для займенника «я»).";
                diag = [
                    { sp: "Давид", he: "מָתַי בָּאתָ הַבַּיְתָה אֶתְמוֹל?", tr: `матай бата хабайта этмоль?`, ua: `Коли ти прийшов додому вчора?` },
                    { sp: "Сара", he: "בָּאתִי בְּשָׁעָה שֶׁבַע וְאָכַלְתִּי אֲרוּחַת עֶרֶב.", tr: `бати бе-шаа шева ве-ахальти арухат ерев.` , ua: `Я прийшов о сьомій і повечеряв.` }
                ];
                quiz = {
                    questionUa: "Яке закінчення додається в минулому часі для займенника 'я'?",
                    questionHeb: "אֵיזֶה סִיּוּם נוֹסֵף בֶּעָבָר לַגּוּף 'אֲנִי'?",
                    questionTr: "ейзе сиюм носеф бе-авар ла-гуф 'ани'?",
                    opts: ["-ти (־תִּי)", "-а (ה-)", "-ну (נוּ-)"],
                    correct: 0
                };
            } else if(i === 7) {
