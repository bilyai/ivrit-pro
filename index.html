<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IVRIT PRO</title>
    <style>
        :root {
            --primary: #0038b8;
            --secondary: #ffd700;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #333333;
            --gray: #777777;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 70px; }
        header { background: var(--primary); color: white; padding: 16px; text-align: center; font-size: 20px; font-weight: bold; position: sticky; top: 0; z-index: 10; }
        .container { padding: 16px; max-width: 600px; margin: 0 auto; }
        .screen { display: none; }
        .screen.active { display: block; }
        
        /* Cards */
        .card { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; transition: transform 0.1s; }
        .card:active { transform: scale(0.98); }
        .card h3 { font-size: 18px; color: var(--primary); margin-bottom: 4px; }
        .card p { font-size: 14px; color: var(--gray); }

        /* Lesson View */
        .hebrew-word { font-size: 28px; font-weight: bold; color: var(--primary); direction: rtl; text-align: right; margin-top: 8px; }
        .transcription { font-style: italic; color: #555; }
        .translation { font-weight: 500; margin-bottom: 8px; }
        .btn { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 8px; }
        .btn-audio { background: #e0e8ff; color: var(--primary); font-weight: bold; }

        /* Bottom Nav */
        nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; border-top: 1px solid #ddd; padding: 10px 0; z-index: 100; }
        .nav-item { text-align: center; color: var(--gray); font-size: 12px; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--primary); font-weight: bold; }
        .nav-item div { font-size: 18px; }

        /* Stats */
        .stats-box { background: #fff3cd; border: 1px solid #ffeeba; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-weight: bold; }
    </style>
</head>
<body>

    <header id="header-title">IVRIT PRO</header>

    <div class="container">
        <!-- ЕКРАН 1: ГОЛОВНА / УРОКИ -->
        <div id="screen-lessons" class="screen active">
            <div class="stats-box">Пройдено уроків: <span id="completed-count">0</span> / 30</div>
            <div id="lessons-list"></div>
        </div>

        <!-- ЕКРАН 2: СЛОВНИК -->
        <div id="screen-dict" class="screen">
            <input type="text" id="search-box" placeholder="Пошук слова..." oninput="searchDictionary()" style="width:100%; padding:12px; border-radius:8px; border:1px solid #ccc; font-size:16px; margin-bottom:12px;">
            <div id="dictionary-list"></div>
        </div>

        <!-- ЕКРАН 3: ТЕСТИ -->
        <div id="screen-tests" class="screen">
            <div class="card">
                <h3>Інтерактивний тест</h3>
                <p id="test-question" style="margin: 12px 0; font-size: 18px; font-weight: bold;"></p>
                <div id="test-options"></div>
                <p id="test-result" style="margin-top: 12px; font-weight: bold;"></p>
            </div>
            <button class="btn" onclick="loadTest()">Наступне питання</button>
        </div>
    </div>

    <!-- НИЖНЯ ПАНЕЛЬ НАВІГАЦІЇ -->
    <nav>
        <div class="nav-item active" onclick="switchScreen('lessons', this)">
            <div>📚</div>Уроки
        </div>
        <div class="nav-item" onclick="switchScreen('dict', this)">
            <div>📖</div>Словник
        </div>
        <div class="nav-item" onclick="switchScreen('tests', this)">
            <div>✍️</div>Тести
        </div>
    </nav>

    <script>
        // База даних уроків (30 уроків та словник)
        const lessonsData = Array.from({ length: 30 }, (_, i) => ({
            id: i + 1,
            title: `Урок ${i + 1}: ${getLessonTitle(i + 1)}`,
            content: getLessonContent(i + 1)
        }));

        function getLessonTitle(num) {
            const titles = [
                "Алфавіт та огласівки (Нікуд)", "Привітання та знайомство", "Числівники (1-10)", 
                "Родина та члени сім'ї", "Професії та заняття", "Кольори та прикметники", 
                "Частини доби та дні тижня", "Їжа та напої", "У ресторані", "Покупки та ціни",
                "Місто та транспорт", "Медицина та здоров'я", "Подорожі та готель", "Дієслова (група 1)",
                "Дієслова (група 2)", "Мобільний зв'язок та інтернет", "Погода та природа", "Хобі та спорт",
                "Час і дати", "Дім та побут", "Одяг та взуття", "Емоції та почуття", "Просторові прийменники",
                "Питальні слова", "Мінливі займенники", "Складні речення", "Діловий іврит", 
                "Сленг та розмовні фрази", "Ідіоми та стійкі вираз", "Підсумковий іспит рівня"
            ];
            return titles[num - 1] || `Граматика та лексика #${num}`;
        }

        function getLessonContent(num) {
            return [
                { he: "שָׁלוֹם", tr: "шалом", ua: "Привіт / Мир" },
                { he: "בּוֹקֶר טוֹב", tr: "бокер тов", ua: "Доброго ранку" },
                { he: "תּוֹדָה", tr: "тода", ua: "Дякую" },
                { he: "לְהִתְרָאוֹת", tr: "лехітраот", ua: "До побачення" }
            ];
        }

        // Рендер уроків
        const lessonsList = document.getElementById('lessons-list');
        lessonsData.forEach(lesson => {
            let card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<h3>${lesson.title}</h3><p>Натисніть, щоб відкрити матеріал та слова</p>`;
            card.onclick = () => openLessonModal(lesson);
            lessonsList.appendChild(card);
        });

        function openLessonModal(lesson) {
            let html = `<h2>${lesson.title}</h2><br>`;
            lesson.content.forEach(item => {
                html += `
                    <div class="card" style="background:#fafafa;">
                        <div class="translation">${item.ua}</div>
                        <div class="transcription">Транскрипція: ${item.tr}</div>
                        <div class="hebrew-word">${item.he}</div>
                        <button class="btn btn-audio" onclick="speakHebrew('${item.he}')">🔊 Озвучити</button>
                    </div>
                `;
            });
            html += `<button class="btn" onclick="completeLesson(${lesson.id})">✅ Позначити як пройдений</button>`;
            html += `<br><br><button class="btn" style="background:#6c757d;" onclick="location.reload()">Назад до списку</button>`;
            document.querySelector('.container').innerHTML = html;
        }

        // Синтез мовлення (працює офлайн на базі Android TTS)
        function speakHebrew(text) {
            if ('speechSynthesis' in window) {
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'he-IL';
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Синтез мовлення не підтримується цим браузером");
            }
        }

        // Прогрес
        let completedLessons = JSON.parse(localStorage.getItem('completed') || '[]');
        document.getElementById('completed-count').innerText = completedLessons.length;

        function completeLesson(id) {
            if (!completedLessons.includes(id)) {
                completedLessons.push(id);
                localStorage.setItem('completed', JSON.stringify(completedLessons));
            }
            alert("Урок збережено як пройдений!");
            location.reload();
        }

        // Словник
        const dictionaryData = [
            { he: "שָׁלוֹם", tr: "шалом", ua: "привіт, мир" },
            { he: "תּוֹדָה", tr: "тода", ua: "дякую" },
            { he: "כֵּן", tr: "кен", ua: "так" },
            { he: "לֹא", tr: "ло", ua: "ні" },
            { he: "מַיִם", tr: "маїм", ua: "вода" },
            { he: "בַּיִת", tr: "баіт", ua: "будинок" },
            { he: "סֵפֶר", tr: "сефер", ua: "книга" }
        ];

        function renderDict(data) {
            const dictList = document.getElementById('dictionary-list');
            dictList.innerHTML = '';
            data.forEach(item => {
                dictList.innerHTML += `
                    <div class="card">
                        <div class="translation">${item.ua} (${item.tr})</div>
                        <div class="hebrew-word">${item.he}</div>
                        <button class="btn btn-audio" onclick="speakHebrew('${item.he}')">🔊 Вимовити</button>
                    </div>
                `;
            });
        }
        renderDict(dictionaryData);

        function searchDictionary() {
            let query = document.getElementById('search-box').value.toLowerCase();
            let filtered = dictionaryData.filter(i => i.ua.toLowerCase().includes(query) || i.tr.includes(query));
            renderDict(filtered);
        }

        // Тести
        const testPool = [
            { q: "Як перекладається слово שָׁלוֹם?", options: ["Привіт", "Дякую", "Бувай", "Ні"], correct: 0 },
            { q: "Що означає תּוֹדָה?", options: ["Так", "Дякую", "Вода", "Дім"], correct: 1 },
            { q: "Яке слово означає 'вода'?", options: ["סֵפֶר", "כֵּן", "מַיִם", "לֹא"], correct: 2 }
        ];

        function loadTest() {
            let test = testPool[Math.floor(Math.random() * testPool.length)];
            document.getElementById('test-question').innerText = test.q;
            let optionsHtml = '';
            test.options.forEach((opt, idx) => {
                optionsHtml += `<button class="btn" style="display:block; width:100%; margin-top:6px; background:#f0f0f0; color:#333;" onclick="checkAnswer(${idx}, ${test.correct})">${opt}</button>`;
            });
            document.getElementById('test-options').innerHTML = optionsHtml;
            document.getElementById('test-result').innerText = '';
        }
        loadTest();

        function checkAnswer(selected, correct) {
            let res = document.getElementById('test-result');
            if (selected === correct) {
                res.style.color = "green";
                res.innerText = "Правильно! Молодець!";
            } else {
                res.style.color = "red";
                res.innerText = "Помилка. Спробуй ще!";
            }
        }

        // Навігація
        function switchScreen(screenName, element) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('screen-' + screenName).classList.add('active');
            element.classList.add('active');
        }
    </script>
</body>
</html>
