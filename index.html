<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IVRIT PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --accent: #f59e0b;
            --success: #10b981;
            --error: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.06);
        }

        [data-theme="dark"] {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-light: #1e293b;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding-bottom: 90px;
            transition: background 0.3s, color 0.3s;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            background: rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
        }

        .theme-btn {
            background: rgba(255,255,255,0.18);
            border: none;
            color: white;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .theme-btn:active { transform: scale(0.9); }

        .container {
            padding: 18px;
            max-width: 540px;
            margin: 0 auto;
        }

        .screen { display: none; animation: fadeIn 0.25s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        /* Progress Hero Card */
        .hero-card {
            background: var(--card);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .hero-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .hero-title { font-size: 15px; font-weight: 600; color: var(--text-muted); }
        .hero-stat { font-size: 18px; font-weight: 800; color: var(--primary); }

        .progress-track {
            width: 100%;
            height: 10px;
            background: var(--border);
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #60a5fa);
            width: 0%;
            border-radius: 99px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Lesson Cards */
        .lesson-card {
            background: var(--card);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: transform 0.15s, border-color 0.2s;
        }

        .lesson-card:active { transform: scale(0.98); }
        .lesson-card.done { border-left: 4px solid var(--success); }

        .lesson-num {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 800;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .lesson-card.done .lesson-num {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .lesson-info { flex: 1; }
        .lesson-info h3 { font-size: 16px; font-weight: 700; margin-bottom: 3px; }
        .lesson-info p { font-size: 13px; color: var(--text-muted); }
        .lesson-arrow { color: var(--text-muted); font-weight: bold; font-size: 18px; }

        /* Word Cards */
        .word-card {
            background: var(--card);
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .word-left { flex: 1; }
        .word-ua { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
        .word-tr { font-size: 14px; color: var(--text-muted); font-weight: 500; }

        .word-right {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        .hebrew-text {
            font-family: 'Rubik', sans-serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--primary);
            direction: rtl;
        }

        .audio-pill {
            background: var(--primary-light);
            color: var(--primary);
            border: none;
            padding: 6px 12px;
            border-radius: 99px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: 0.15s;
        }
        .audio-pill:active { transform: scale(0.92); background: var(--primary); color: white; }

        /* Buttons */
        .btn-main {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            transition: 0.15s;
            margin-top: 8px;
        }
        .btn-main:active { transform: scale(0.98); }

        .btn-secondary {
            width: 100%;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 13px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Search Input */
        .search-wrap { position: relative; margin-bottom: 16px; }
        .search-input {
            width: 100%;
            padding: 14px 16px 14px 42px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-size: 15px;
            outline: none;
            box-shadow: var(--shadow);
        }
        .search-input:focus { border-color: var(--primary); }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        /* Quiz Options */
        .quiz-option {
            width: 100%;
            text-align: left;
            background: var(--card);
            color: var(--text);
            border: 2px solid var(--border);
            padding: 15px 18px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.15s;
        }
        .quiz-option:active { transform: scale(0.98); }
        .quiz-option.correct { border-color: var(--success); background: rgba(16, 185, 129, 0.12); color: var(--success); }
        .quiz-option.wrong { border-color: var(--error); background: rgba(239, 68, 68, 0.12); color: var(--error); }

        /* Bottom Navigation */
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 14px;
            z-index: 100;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.04);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            transition: 0.2s;
        }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 22px; transition: transform 0.2s; }
        .nav-item.active .nav-icon { transform: translateY(-2px); }

        .lesson-header-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }
        .back-circle {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🇮🇱 IVRIT <span>PRO</span></div>
        <button class="theme-btn" onclick="toggleTheme()" id="theme-icon" title="Змінити тему">🌙</button>
    </header>

    <div class="container">
        <!-- ЕКРАН 1: УРОКИ -->
        <div id="screen-lessons" class="screen active">
            <div id="lessons-home-view">
                <div class="hero-card">
                    <div class="hero-top">
                        <span class="hero-title">Твій прогрес курсу</span>
                        <span class="hero-stat"><span id="completed-count">0</span> / 30</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="progress-bar"></div>
                    </div>
                </div>
                <div id="lessons-list"></div>
            </div>

            <!-- ВНУТРІШНІЙ ЕКРАН УРОКУ -->
            <div id="lesson-detail-view" style="display: none;">
                <div class="lesson-header-bar">
                    <button class="back-circle" onclick="closeLesson()">←</button>
                    <div>
                        <div style="font-size: 12px; color: var(--primary); font-weight: 700;" id="detail-badge">УРОК 1</div>
                        <h2 style="font-size: 18px; font-weight: 800;" id="detail-title">Назва уроку</h2>
                    </div>
                </div>
                <div id="lesson-words-container"></div>
                <button class="btn-main" id="complete-btn" onclick="markLessonDone()">✅ Завершити урок</button>
                <button class="btn-secondary" onclick="closeLesson()">Повернутися до списку</button>
            </div>
        </div>

        <!-- ЕКРАН 2: СЛОВНИК -->
        <div id="screen-dict" class="screen">
            <div class="search-wrap">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-box" class="search-input" placeholder="Пошук українською або транскрипцією..." oninput="searchDictionary()">
            </div>
            <div id="dictionary-list"></div>
        </div>

        <!-- ЕКРАН 3: ТЕСТИ -->
        <div id="screen-tests" class="screen">
            <div class="hero-card">
                <div style="display:flex; justify-content:space-between; margin-bottom:14px;">
                    <span style="font-size:13px; font-weight:700; color:var(--primary); text-transform:uppercase;">Перевірка знань</span>
                    <span style="font-size:13px; font-weight:700; color:var(--success);">Бали: <span id="quiz-score">0</span></span>
                </div>
                <div id="test-question" style="font-size: 20px; font-weight: 800; margin-bottom: 18px; line-height: 1.4;"></div>
                <div id="test-options"></div>
            </div>
            <button class="btn-main" onclick="loadTest()">Наступне питання →</button>
        </div>
    </div>

    <!-- НИЖНЯ НАВІГАЦІЯ -->
    <nav>
        <div class="nav-item active" onclick="switchScreen('lessons', this)">
            <span class="nav-icon">📚</span>
            <span>Уроки</span>
        </div>
        <div class="nav-item" onclick="switchScreen('dict', this)">
            <span class="nav-icon">📖</span>
            <span>Словник</span>
        </div>
        <div class="nav-item" onclick="switchScreen('tests', this)">
            <span class="nav-icon">🎯</span>
            <span>Тести</span>
        </div>
    </nav>

                { he: "גֶּשֶׁם", tr: "гешем", ua: "Дощ" },
                { he: "שֶׁמֶשׁ", tr: "шемеш", ua: "Сонце" }
            ],
            18: [
                { he: "שׂוֹחֶה", tr: "сохе", ua: "Плаваю" },
                { he: "רוֹكֵד", tr: "рокед", ua: "Танцюю" },
                { he: "סְפּוֹרְט", tr: "спорт", ua: "Спорт" },
                { he: "מִשְׂחָק", tr: "мисхак", ua: "Гра" }
            ],
            19: [
                { he: "מַה הַשָּׁעָה?", tr: "ма ха-шаа?", ua: "Котра година?" },
                { he: "הַיּוֹם", tr: "хайом", ua: "Сьогодні" },
                { he: "מָחָר", tr: "махар", ua: "Завтра" },
                { he: "אֶתְמוֹל", tr: "этмоль", ua: "Вчора" }
            ],
            20: [
                { he: "בַּיִת", tr: "баіт", ua: "Дім / Будинок" },
                { he: "חֶדֶר", tr: "хедер", ua: "Кімната" },
                { he: "מִטָּה", tr: "мита", ua: "Ліжко" },
                { he: "מַטְבֵּחַ", tr: "матбеа", ua: "Кухня" }
            ],
            21: [
                { he: "בְּגָדִים", tr: "бегадим", ua: "Одяг" },
                { he: "נַעֲלַיִם", tr: "наалаїм", ua: "Взуття" },
                { he: "חֻלְצָה", tr: "хульца", ua: "Сорочка / Футболка" },
                { he: "מִכְנָסַיִם", tr: "михнасаїм", ua: "Штани" }
            ],
            22: [
                { he: "שָׂמֵחַ", tr: "самеах", ua: "Веселий / Радісний" },
                { he: "עָצֵב", tr: "ацев", ua: "Сумний" },
                { he: "עָיֵף", tr: "аєф", ua: "Втомлений" },
                { he: "רוֹגֵעַ", tr: "рогеа", ua: "Спокійний" }
            ],
            23: [
                { he: "עַל", tr: "аль", ua: "На / Про" },
                { he: "תַּחַת", tr: "тахат", ua: "Під" },
                { he: "לְיַד", tr: "леяд", ua: "Біля / Поруч" },
                { he: "בְּתוֹךְ", tr: "бетох", ua: "Всередині" }
            ],
            24: [
                { he: "מִי?", tr: "ми?", ua: "Хто?" },
                { he: "מָה?", tr: "ма?", ua: "Що?" },
                { he: "אֵיפֹה?", tr: "ейфо?", ua: "Де?" },
                { he: "לָמָּה?", tr: "лама?", ua: "Чому?" }
            ],
            25: [
                { he: "אֲנִי", tr: "ани", ua: "Я" },
                { he: "אַתָּה / אַתְּ", tr: "ата / ат", ua: "Ти (чол. / жін.)" },
                { he: "הוּא / הִיא", tr: "ху / хи", ua: "Він / Вона" },
                { he: "אֲנַחְנוּ", tr: "анахну", ua: "Ми" }
            ],
            26: [
                { he: "אִם", tr: "им", ua: "Якщо" },
                { he: "כִּי", tr: "ки", ua: "Тому що" },
                { he: "אֲבָל", tr: "аваль", ua: "Але" },
                { he: "גַּם", tr: "гам", ua: "Також" }
            ],
            27: [
                { he: "פְּגִישָׁה", tr: "пгиша", ua: "Зустріч" },
                { he: "חוֹזֶה", tr: "хозе", ua: "Контракт / Договір" },
                { he: "עֲבוֹדָה", tr: "авода", ua: "Робота" },
                { he: "מַשׂכּוֹרֶת", tr: "маскорет", ua: "Зарплата" }
            ],
            28: [
                { he: "יָאֲלָה", tr: "яала", ua: "Давай / Поїхали (сленг)" },
                { he: "אַחְלָה", tr: "ахла", ua: "Круто / Чудово" },
                { he: "סָבָּבָה", tr: "сабава", ua: "Все супер / Ок" },
                { he: "חָבֵר", tr: "хавер", ua: "Друг / Дружище" }
            ],
            29: [
                { he: "לִבְכּוֹת על חלב שנשפך", tr: "ливкот аль халев ше-нишpах", ua: "Плакати через розлите молоко" },
                { he: "ראש גדול", tr: "рош гадоль", ua: "Велика голова (відповідальний підхід)" },
                { he: "בָּרֹאשׁ", tr: "ба-рош", ua: "У голові" }
            ],
            30: [
                { he: "מִבְחָן", tr: "мивхан", ua: "Іспит / Тест" },
                { he: "הַצְלָחָה", tr: "хацлаха", ua: "Успіх / Удачі!" },
                { he: "סִיּוּם", tr: "сиюм", ua: "Завершення" },
                { he: "מַזָּל טוֹב", tr: "мазаль тов", ua: "Вітаю / Пощастило" }
            ]
        };

        let completedLessons = JSON.parse(localStorage.getItem('completed') || '[]');
        let currentOpenedLessonId = null;

        function renderLessons() {
            const list = document.getElementById('lessons-list');
            list.innerHTML = '';
            document.getElementById('completed-count').innerText = completedLessons.length;
            document.getElementById('progress-bar').style.width = `${(completedLessons.length / 30) * 100}%`;

            lessonTitles.forEach((title, idx) => {
                const id = idx + 1;
                const isDone = completedLessons.includes(id);
                const card = document.createElement('div');
                card.className = `lesson-card ${isDone ? 'done' : ''}`;
                card.innerHTML = `
                    <div class="lesson-num">${isDone ? '✓' : id}</div>
                    <div class="lesson-info">
                        <h3>${title}</h3>
                        <p>${isDone ? 'Пройдено • Натисніть для повторення' : 'Слова, транскрипція та аудіовимова'}</p>
                    </div>
                    <div class="lesson-arrow">›</div>
                `;
                card.onclick = () => openLesson(id, title);
                list.appendChild(card);
            });
        }

        function openLesson(id, title) {
            currentOpenedLessonId = id;
            document.getElementById('lessons-home-view').style.display = 'none';
            document.getElementById('lesson-detail-view').style.display = 'block';
            document.getElementById('detail-badge').innerText = `УРОК ${id} З 30`;
            document.getElementById('detail-title').innerText = title;

            // Підтягуємо слова для конкретного уроку (або базові, якщо раптом немає)
            const words = lessonContents[id] || [
                { he: "שָׁלוֹם", tr: "шалом", ua: "Привіт / Мир" },
                { he: "תּוֹדָה", tr: "тода", ua: "Дякую" }
            ];

            const container = document.getElementById('lesson-words-container');
            container.innerHTML = words.map(w => `
                <div class="word-card">
                    <div class="word-left">
                        <div class="word-ua">${w.ua}</div>
                        <div class="word-tr">[ ${w.tr} ]</div>
                    </div>
                    <div class="word-right">
                        <div class="hebrew-text">${w.he}</div>
                        <button class="audio-pill" onclick="speakHebrew('${w.he}')">🔊 Слухати</button>
                    </div>
                </div>
            `).join('');

            const isDone = completedLessons.includes(id);
            const btn = document.getElementById('complete-btn');
            btn.innerText = isDone ? '✅ Урок вже пройдено' : '✅ Завершити урок';
            btn.style.background = isDone ? 'var(--success)' : 'var(--primary)';
            window.scrollTo(0, 0);
        }

        function closeLesson() {
            document.getElementById('lesson-detail-view').style.display = 'none';
            document.getElementById('lessons-home-view').style.display = 'block';
            renderLessons();
        }

        function markLessonDone() {
            if (currentOpenedLessonId && !completedLessons.includes(currentOpenedLessonId)) {
                completedLessons.push(currentOpenedLessonId);
                localStorage.setItem('completed', JSON.stringify(completedLessons));
            }
            closeLesson();
        }

        // Озвучування
        function speakHebrew(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'he-IL';
                u.rate = 0.9;
                window.speechSynthesis.speak(u);
            }
        }

        // Словник
        const dictionaryData = [
            { he: "שָׁלוֹם", tr: "шалом", ua: "Привіт / Мир" },
            { he: "בּוֹקֶר טוֹב", tr: "бокер тов", ua: "Доброго ранку" },
            { he: "תּוֹדָה", tr: "тода", ua: "Дякую" },
            { he: "בְּבַקָּשָׁה", tr: "бевакаша", ua: "Будь ласка" },
            { he: "סְלִיחָה", tr: "сліха", ua: "Вибачте" },
            { he: "כֵּן", tr: "кен", ua: "Так" },
            { he: "לֹא", tr: "ло", ua: "Ні" },
            { he: "מַיִם", tr: "маїм", ua: "Вода" },
            { he: "לֶחֶם", tr: "лехем", ua: "Хліб" },
            { he: "קָפֶה", tr: "кафе", ua: "Кава" },
            { he: "בַּיִת", tr: "баіт", ua: "Дім / Будинок" },
            { he: "סֵפֶר", tr: "сефер", ua: "Книга" },
            { he: "טוֹב", tr: "тов", ua: "Добре / Хороший" },
            { he: "לְהִתְרָאוֹת", tr: "лехітраот", ua: "До побачення" }
        ];

        function renderDict(data) {
            document.getElementById('dictionary-list').innerHTML = data.map(w => `
                <div class="word-card">
                    <div class="word-left">
                        <div class="word-ua">${w.ua}</div>
                        <div class="word-tr">[ ${w.tr} ]</div>
                    </div>
                    <div class="word-right">
                        <div class="hebrew-text">${w.he}</div>
                        <button class="audio-pill" onclick="speakHebrew('${w.he}')">🔊 Вимовити</button>
                    </div>
                </div>
            `).join('');
        }

        function searchDictionary() {
            const q = document.getElementById('search-box').value.toLowerCase();
            renderDict(dictionaryData.filter(i => i.ua.toLowerCase().includes(q) || i.tr.toLowerCase().includes(q)));
        }

        // Тести
        const testPool = [
            { q: "Як перекладається «שָׁלוֹם»?", options: ["Привіт / Мир", "Дякую", "До побачення", "Вибачте"], correct: 0 },
            { q: "Що означає «תּוֹדָה»?", options: ["Будь ласка", "Дякую", "Вода", "Доброго ранку"], correct: 1 },
            { q: "Оберіть переклад слова «מַיִם»:", options: ["Хліб", "Кава", "Вода", "Дім"], correct: 2 },
            { q: "Як сказати на івриті «Добре»?", options: ["כֵּן (кен)", "לֹא (ло)", "טוֹב (тов)", "סֵפֶר (сефер)"], correct: 2 },
            { q: "Що означає фраза «בּוֹקֶר טוֹב»?", options: ["Доброго вечора", "Доброго ранку", "На добраніч", "Як справи?"], correct: 1 }
        ];

        let score = parseInt(localStorage.getItem('ivrit_score') || '0');
        document.getElementById('quiz-score').innerText = score;
        let answeredCurrent = false;

        function loadTest() {
            answeredCurrent = false;
            const test = testPool[Math.floor(Math.random() * testPool.length)];
            document.getElementById('test-question').innerText = test.q;
            document.getElementById('test-options').innerHTML = test.options.map((opt, idx) => `
                <button class="quiz-option" onclick="checkAnswer(this, ${idx}, ${test.correct})">${opt}</button>
            `).join('');
        }

        function checkAnswer(btn, selected, correct) {
            if (answeredCurrent) return;
            answeredCurrent = true;
            const allBtns = document.querySelectorAll('.quiz-option');
            if (selected === correct) {
                btn.classList.add('correct');
                score += 10;
                localStorage.setItem('ivrit_score', score);
                document.getElementById('quiz-score').innerText = score;
            } else {
                btn.classList.add('wrong');
                allBtns[correct].classList.add('correct');
            }
        }

        function switchScreen(name, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('screen-' + name).classList.add('active');
            el.classList.add('active');
            if (name === 'lessons') closeLesson();
        }

        renderLessons();
        renderDict(dictionaryData);
        loadTest();
    </script>
</body>
</html>
