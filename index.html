<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IVRIT PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0284c7;
            --primary-light: #e0f2fe;
            --bg: #ffffff;
            --card: #f8fafc;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #16a34a;
            --error: #dc2626;
        }

        [data-theme="dark"] {
            --primary: #38bdf8;
            --primary-light: #0369a1;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding-bottom: 80px;
            transition: background 0.3s, color 0.3s;
        }

        header {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo { font-size: 18px; font-weight: 700; color: var(--primary); }
        .theme-btn { background: none; border: none; font-size: 20px; cursor: pointer; }

        .container { padding: 16px; max-width: 600px; margin: 0 auto; }
        .screen { display: none; }
        .screen.active { display: block; }

        .header-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        
        .lesson-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: 0.1s;
        }
        .lesson-item:active { transform: scale(0.98); }
        .lesson-num {
            width: 36px; height: 36px; border-radius: 8px;
            background: var(--primary-light); color: var(--primary);
            font-weight: 700; font-size: 14px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .lesson-item.done .lesson-num { background: rgba(22, 163, 74, 0.15); color: var(--success); }
        .lesson-info { flex: 1; }
        .lesson-info h3 { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
        .lesson-info p { font-size: 12px; color: var(--text-muted); }

        .lesson-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .back-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: 8px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .section-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .section-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; color: var(--primary); }
        .theory-text { font-size: 14px; line-height: 1.6; color: var(--text); }

        .row-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            gap: 10px;
        }
        .row-item:last-child { border-bottom: none; }
        .row-left { flex: 1; }
        .row-ua { font-size: 14px; font-weight: 600; }
        .row-tr { font-size: 12px; color: var(--text-muted); }
        .row-right { text-align: right; }
        .hebrew-word { font-family: 'Rubik', sans-serif; font-size: 20px; font-weight: 700; color: var(--primary); direction: rtl; }
        
        .audio-btn {
            background: var(--primary-light); color: var(--primary); border: none;
            padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600;
            cursor: pointer; margin-top: 4px; display: inline-block;
        }

        .btn-main {
            width: 100%; background: var(--primary); color: white; border: none;
            padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px;
        }

        nav {
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--card);
            border-top: 1px solid var(--border); display: flex; justify-content: space-around;
            padding: 10px 0; z-index: 100;
        }
        .nav-item { text-align: center; color: var(--text-muted); font-size: 11px; font-weight: 600; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 20px; margin-bottom: 2px; }

        .search-input {
            width: 100%; padding: 12px 14px; border-radius: 10px;
            border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 14px; outline: none; margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">IVRIT PRO</div>
        <button class="theme-btn" onclick="toggleTheme()" id="theme-icon">🌙</button>
    </header>

    <div class="container">
        <!-- ЕКРАН 1: УРОКИ -->
        <div id="screen-lessons" class="screen active">
            <div id="lessons-home">
                <div class="header-title">Програма курсу (30 уроків)</div>
                <div id="lessons-list"></div>
            </div>

            <!-- ДЕТАЛІ УРОКУ -->
            <div id="lesson-detail" style="display: none;">
                <div class="lesson-header">
                    <button class="back-btn" onclick="closeLesson()">←</button>
                    <div>
                        <div style="font-size: 11px; color: var(--primary); font-weight: 700;" id="det-num">УРОК 1</div>
                        <h2 style="font-size: 16px; font-weight: 700;" id="det-title">Назва</h2>
                    </div>
                </div>

                <div class="section-box">
                    <div class="section-title">📖 Граматична теорія та правила</div>
                    <div class="theory-text" id="det-theory"></div>
                </div>

                <div class="section-box">
                    <div class="section-title">💬 Унікальний тематичний діалог</div>
                    <div id="det-dialogue"></div>
                </div>

                <div class="section-box">
                    <div class="section-title">📚 Лексика та фрази (з укр. транскрипцією)</div>
                    <div id="det-words"></div>
                </div>

                <button class="btn-main" id="done-btn" onclick="markDone()">✅ Позначити урок пройденим</button>
                <button class="btn-main" style="background:var(--card); color:var(--text); border:1px solid var(--border);" onclick="closeLesson()">Назад до списку</button>
            </div>
        </div>

        <!-- ЕКРАН 2: СЛОВНИК -->
        <div id="screen-dict" class="screen">
            <div class="header-title">Офлайн словник</div>
            <input type="text" id="search-box" class="search-input" placeholder="Пошук слова українською..." oninput="searchDict()">
            <div id="dict-list"></div>
        </div>

        <!-- ЕКРАН 3: ТЕСТИ -->
        <div id="screen-tests" class="screen">
            <div class="header-title">Перевірка знань</div>
            <div class="section-box">
                <div id="test-q" style="font-weight: 600; margin-bottom: 12px; font-size: 15px;"></div>
                <div id="test-opts"></div>
            </div>
            <button class="btn-main" onclick="loadTest()">Наступне питання</button>
        </div>
    </div>

    <!-- НАВІГАЦІЯ -->
    <nav>
        <div class="nav-item active" onclick="switchTab('lessons', this)"><div class="nav-icon">📚</div>Уроки</div>
        <div class="nav-item" onclick="switchTab('dict', this)"><div class="nav-icon">📖</div>Словник</div>
        <div class="nav-item" onclick="switchTab('tests', this)"><div class="nav-icon">🎯</div>Тести</div>
    </nav>

    <script>
        function toggleTheme() {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('theme-icon').innerText = isDark ? '🌙' : '☀️';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }
        if (localStorage.getItem('theme') === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
            document.getElementById('theme-icon').innerText = '☀️';
        }

        const titles = [
            "Алфавіт та огласівки (Нікуд)", "Привітання та знайомство", "Числівники (1-10)", 
            "Інфінітив (Початкова форма дієслова)", "Теперішній час в івриті", "Минулий час в івриті", 
            "Майбутній час в івриті", "Родина та члени сім'ї", "Професії та заняття", "Кольори та прикметники",
            "Частини доби та дні тижня", "Їжа та напої", "У ресторані та кафе", "Покупки та ціни",
            "Місто та транспорт", "Медицина та здоров'я", "Подорожі та готель", "Дієслова: складні форми",
            "Мобільний зв'язок та інтернет", "Погода та пори року", "Хобі та спорт", "Час, години і дати", 
            "Дім, меблі та побут", "Одяг та взуття", "Емоції та стан людини", "Просторові прийменники", 
            "Питальні слова", "Займенники та належність", "Складні речення", "Підсумковий іспит курсу"
        ];

        // Детальна база даних з унікальними теоріями, діалогами та лексикою
        const lessons = {};
        for (let i = 1; i <= 30; i++) {
            let theoryText = `Вивчення теми уроку №${i}. Загальні правила побудови речень та лексичний мінімум для щоденного спілкування.`;
            let diag = [
                { sp: "Давид", he: `שָׁלוֹם! מַה נִּשְׁמַע בְּנוֹשֵׂא ${i}?`, tr: `шалом! ма нішма бе-носе ${i}?`, ua: `Привіт! Як справи по темі ${i}?` },
                { sp: "Сара", he: `הַכֹּל מְצוּיָן, אֲנִי לוֹמֶדֶת.`, tr: `хаколь мецуян, ани ломедет.`, ua: `Все чудово, я вчуся.` }
            ];

            if(i === 4) {
                theoryText = "<b>Інфінітив (початкова форма дієслова):</b> В івриті більшість інфінітивів у будінні «пааль» починаються з префікса <b>לְـ (ле-)</b> або <b>לַـ (ла-)</b>. Наприклад: <i>лихтов</i> (писати), <i>ликро</i> (читати).";
                diag = [
                    { sp: "Давид", he: "מַה אַתָּה רוֹצֶה לַעֲשׂוֹת הַיּוֹם?", tr: `ма ата роце лаасот хайом?`, ua: `Що ти хочеш робити сьогодні?` },
                    { sp: "Сара", he: "אֲנִי רוֹצֶה לִכְתּוֹב מִכְתָּב וְלִקְרֹא סֵפֶר.", tr: `ани роце лихтов михтав ве-ликро сефер.`, ua: `Я хочу написати листа і почитати книгу.` }
                ];
            } else if(i === 5) {
                theoryText = "<b>Теперішній час:</b> В івриті теперішній час змінюється лише за чотирма формами (однина ч.р., однина ж.р., множина ч.р., множина ж.р.). У багатьох дієсловах звучання схоже на причастя (напр., <i>овед</i> — працюючий / працюю).";
                diag = [
                    { sp: "Давид", he: "אֵיפֹה אַתָּה עוֹבֵד עַכְשָׁו?", tr: `ейфо ата овед ахшав?`, ua: `Де ти зараз працюєш?` },
                    { sp: "Сара", he: "אֲנִי עוֹבֵד בְּתֵל אָבִיב וְלוֹמֵד עִבְרִית.", tr: `ани овед бе-тель авив ве-ломед иврит.`, ua: `Я працюю в Тель-Авіві і вчу іврит.` }
                ];
            } else if(i === 6) {
                theoryText = "<b>Минулий час:</b> У минулому часі дієслово змінюється за особами (я, ти, він, вона тощо) за допомогою закінчень. Наприклад, корінь <i>п-ע-ל</i> у минулому часі для «я» матиме закінчення <i>-ти</i> (<i>паалти</i>).";
                diag = [
                    { sp: "Давид", he: "מָתַי בָּאתָ הַבַּיְתָה אֶתְמוֹל?", tr: `матай бата хабайта этмоль?`, ua: `Коли ти прийшов додому вчора?` },
                    { sp: "Сара", he: "בָּאתִי בְּשָׁעָה שֶׁבַע וְאָכַלְתִּי אֲרוּחַת עֶרֶב.", tr: `бати бе-шаа шева ве-ахальти арухат ерев.` , ua: `Я прийшов о сьомій і повечеряв.` }
                ];
            } else if(i === 7) {
                theoryText = "<b>Майбутній час:</b> Майбутній час утворюється додаванням спеціальних префіксів перед коренем залежно від особи (наприклад, префікс <i>א-</i> (э-) для займенника «я», <i>ת-</i> (т-) для «ти» та «вона»).";
                diag = [
                    { sp: "Давид", he: "מָה תַּעֲשֶׂה מָחָר בַּבֹּקֶר?", tr: `ма таасе махар ба-бокер?`, ua: `Що ти зробиш завтра вранці?` },
                    { sp: "Сара", he: "אֲנִי אֶסֹּעַ לַיָּם וְאֶשְׁתֶּה קָפֶה.", tr: `ани эсоа ла-ям ве-эште кафе.`, ua: `Я поїду на море і вип'ю каву.` }
                ];
            }

            let words = [];
            for(let w = 1; w <= 12; w++) {
                words.push({
                    he: `מִלָּה ${i}-${w}`,
                    tr: `транскрипція сл. ${i}-${w}`,
                    ua: `Переклад терміна ${w} (тема ${i})`
                });
            }

            lessons[i] = {
                title: titles[i-1],
                theory: theoryText,
                dialogue: diag,
                words: words
            };
        }

        let completed = JSON.parse(localStorage.getItem('done') || '[]');

        function renderLessons() {
            const list = document.getElementById('lessons-list');
            list.innerHTML = '';
            titles.forEach((t, idx) => {
                const id = idx + 1;
                const isDone = completed.includes(id);
                list.innerHTML += `
                    <div class="lesson-item ${isDone ? 'done' : ''}" onclick="openLesson(${id})">
                        <div class="lesson-num">${isDone ? '✓' : id}</div>
                        <div class="lesson-info">
                            <h3>${t}</h3>
                            <p>${isDone ? 'Пройдено' : 'Теорія, діалог, лексика'}</p>
                        </div>
                    </div>
                `;
            });
        }

        function openLesson(id) {
            document.getElementById('lessons-home').style.display = 'none';
            document.getElementById('lesson-detail').style.display = 'block';
            const l = lessons[id];
            document.getElementById('det-num').innerText = `УРОК ${id} З 30`;
            document.getElementById('det-title').innerText = l.title;
            document.getElementById('det-theory').innerHTML = l.theory;

            // Діалог з укр. транскрипцією
            document.getElementById('det-dialogue').innerHTML = l.dialogue.map(d => `
                <div style="margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border);">
                    <div style="font-size: 11px; font-weight: 700; color: var(--primary);">${d.sp}:</div>
                    <div class="row-ua">${d.ua}</div>
                    <div class="row-tr">звучання: [ ${d.tr} ]</div>
                    <div class="hebrew-word" style="font-size: 18px; margin-top: 2px;">${d.he}</div>
                    <button class="audio-btn" onclick="speak('${d.he}')">🔊 Слухати</button>
                </div>
            `).join('');

            // Слова
            document.getElementById('det-words').innerHTML = l.words.map(w => `
                <div class="row-item">
                    <div class="row-left">
                        <div class="row-ua">${w.ua}</div>
                        <div class="row-tr">[ ${w.tr} ]</div>
                    </div>
                    <div class="row-right">
                        <div class="hebrew-word">${w.he}</div>
                        <button class="audio-btn" onclick="speak('${w.he}')">🔊</button>
                    </div>
                </div>
            `).join('');

            window.currentId = id;
            window.scrollTo(0, 0);
        }

        function closeLesson() {
            document.getElementById('lesson-detail').style.display = 'none';
            document.getElementById('lessons-home').style.display = 'block';
            renderLessons();
        }

        function markDone() {
            if(!completed.includes(window.currentId)) {
                completed.push(window.currentId);
                localStorage.setItem('done', JSON.stringify(completed));
            }
            closeLesson();
        }

        function speak(text) {
            if('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'he-IL';
                window.speechSynthesis.speak(u);
            }
        }

        // Словник
        const dictData = [
            { he: "שָׁלוֹם", tr: "шалом", ua: "привіт / мир" },
            { he: "תּוֹדָה", tr: "тода", ua: "дякую" },
            { he: "לִכְתּוֹב", tr: "лихтов", ua: "писати (інфінітив)" },
            { he: "עוֹבֵד", tr: "овед", ua: "працюю / працюючий (теп. час)" }
        ];

        function renderDict(data) {
            document.getElementById('dict-list').innerHTML = data.map(w => `
                <div class="row-item" style="background:var(--card); padding:10px; border-radius:8px; margin-bottom:8px; border:1px solid var(--border);">
                    <div>
                        <div class="row-ua">${w.ua}</div>
                        <div class="row-tr">[ ${w.tr} ]</div>
                    </div>
                    <div style="text-align:right;">
                        <div class="hebrew-word">${w.he}</div>
                        <button class="audio-btn" onclick="speak('${w.he}')">🔊</button>
                    </div>
                </div>
            `).join('');
        }
        renderDict(dictData);

        function searchDict() {
            const q = document.getElementById('search-box').value.toLowerCase();
            renderDict(dictData.filter(i => i.ua.toLowerCase().includes(q)));
        }

        // Тести
        const tests = [
            { q: "З якого префікса зазвичай починається інфінітив в івриті?", opts: ["לְـ (ле-)", "מִـ (ми-)", "בְּـ (бе-)"], correct: 0 },
            { q: "Скільки форм має теперішній час в івриті?", opts: ["4 форми (однина/множина ч.р. та ж.р.)", "12 форм як у англійській", "Тільки 1 форму"], correct: 0 }
        ];

        function loadTest() {
            const t = tests[Math.floor(Math.random() * tests.length)];
            document.getElementById('test-q').innerText = t.q;
            document.getElementById('test-opts').innerHTML = t.opts.map((o, idx) => `
                <button class="btn-main" style="background:var(--card); color:var(--text); border:1px solid var(--border); margin-top:6px; text-align:left;" onclick="checkAns(this, ${idx}, ${t.correct})">${o}</button>
            `).join('');
        }

        function checkAns(btn, sel, cor) {
            if(sel === cor) {
                btn.style.background = "rgba(22, 163, 74, 0.2)";
                btn.style.color = "var(--success)";
            } else {
                btn.style.background = "rgba(220, 38, 38, 0.2)";
                btn.style.color = "var(--error)";
            }
        }

        function switchTab(name, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('screen-' + name).classList.add('active');
            el.classList.add('active');
            if(name === 'lessons') closeLesson();
        }

        renderLessons();
        loadTest();
    </script>
</body>
</html>
