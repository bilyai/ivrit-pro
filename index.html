{id:3,title:"Дієслова теперішнього часу",hebrewTitle:"פְּעָלִים בַּהוֹוֶה",

const TABS=["Вислів і план","Теорія","Словник","Діалоги","Тест"];
let cur=0,tab=0,qi=0,score=0,answered=false;
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="he-IL";u.rate=.75;speechSynthesis.speak(u)}catch(e){}}

function view(){const L=ivritCourses[cur],v=document.getElementById("view");nav();
document.getElementById("meta").innerHTML=`<div class="card"><h2>Урок ${L.id}. ${L.title}</h2><div class="he">${L.hebrewTitle}</div><div class="mu">90 хв · 5 клас</div></div>`;
let h="";
if(tab==0){const q=L.quote;h=`<div class="card quote"><div class="row"><div class="he">${q.he}</div>${sp(q.he)}</div><div class="tr">${q.tr}</div><div>${q.uk}</div><div class="mu">— ${q.who}</div></div><div class="card plan"><b>План на 90 хвилин</b><br><span>Вислів — 5</span><span>Теорія — 20</span><span>Словник — 20</span><span>Діалоги — 20</span><span>Тест — 25</span></div>`}
if(tab==1)h=L.theory.map(t=>`<div class="card">${t}</div>`).join("");

function quiz(L){if(qi>=L.quiz.length)return `<div class="card"><h2>Результат: ${score} з ${L.quiz.length}</h2><button data-act="again">Пройти ще раз</button></div>`;
